name: CI

on:
  push:
    branches: [main, fix-ci/**]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the change can affect the build, the lint, or the tests. Only a pull request
  # whose every changed file is one that none of them reads skips them; a push, a call from another
  # workflow, and any file this list does not name run everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # lists the pull request's changed files
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - name: Decide whether the change touches what the Go jobs read
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A rename lists its old name too, so moving a Go file out of a Go path still counts.
          files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          # The API lists at most 3000 files of a pull request; past that the list is incomplete.
          if [ "$(wc -l <<<"$files")" -ge 3000 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          go=false
          while IFS= read -r file; do
            case "$file" in
              *.md | skills/* | LICENSE | .editorconfig | .gitignore | .markdownlint-cli2.jsonc \
                | cspell.json | dprint.json | .pre-commit-config.yaml | Taskfile.yml \
                | .github/dependabot.yml | .github/workflows/audit.yml | .github/workflows/live.yml \
                | .github/workflows/prek.yml | .github/workflows/publish.yml \
                | .github/workflows/update-tools.yml) ;;
              *)
                echo "$file can affect the Go jobs"
                go=true
                ;;
            esac
          done <<<"$files"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-dprint # zizmor: ignore[self-repository] — actionlint rejects $/
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

  test:
    name: Test / ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Check coverage floor
        if: matrix.os == 'ubuntu-latest'
        run: go tool go-test-coverage --config=.coverage.yml
      - name: Build
        run: go build ./...

  # The suite on the oldest git ils accepts and on the newest git release, so that a git release
  # that changes behavior fails here instead of whenever a runner image updates its git.
  test-git:
    name: Test / git ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # git.MinimumVersion, which setup-git reads from the code; the suite fails unless the git
          # it finds is exactly this.
          - name: minimum
            target: minimum
            version: minimum
          # The git of Ubuntu 24.04, AlmaLinux 8, and openSUSE Leap 15.6: the most common pinned
          # LTS git above the minimum.
          - name: "2.43.0"
            target: ""
            version: "2.43.0"
          # The newest stable release on kernel.org, resolved when the job runs.
          - name: latest
            target: latest
            version: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-git # zizmor: ignore[self-repository] — actionlint rejects $/
        id: git
        with:
          version: ${{ matrix.version }}
      - name: Check that git on PATH is the one this job built
        env:
          GIT_BUILT: ${{ steps.git.outputs.path }}
        run: |
          set -euo pipefail
          if [ "$(command -v git)" != "$GIT_BUILT" ]; then
            echo "git on PATH is $(command -v git), want the one this job built, $GIT_BUILT" >&2
            exit 1
          fi
          git --version
      - name: Run tests
        env:
          ILS_TEST_GIT: ${{ matrix.target }}
          ILS_TEST_GIT_VERSION: ${{ steps.git.outputs.version }}
        run: go test -race ./...

  # The one check the trunk's ruleset requires of this workflow, so that the jobs above can be
  # skipped without leaving a required check waiting. It passes when each of them passed or was
  # skipped, and fails otherwise.
  ci-ok:
    name: CI ok
    needs: [changes, lint, test, test-git]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "a job of this workflow ended $result: $RESULTS" >&2
                exit 1
                ;;
            esac
          done
