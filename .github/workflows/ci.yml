name: CI

on:
  push:
    branches: [main, fix-ci/**, plan/**, "v[0-9]*"]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-dprint # zizmor: ignore[self-repository] — actionlint rejects $/
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7

  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Check coverage floor
        if: matrix.os == 'ubuntu-latest'
        run: go tool go-test-coverage --config=.coverage.yml
      - name: Build
        run: go build ./...

  # The suite on the oldest git ils accepts and on the newest git release, so that a git release
  # that changes behavior fails here instead of whenever a runner image updates its git.
  test-git:
    name: Test / git ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # git.MinimumVersion; the suite fails unless the git it finds is exactly this.
          - target: minimum
            version: "2.34.1"
          # The newest stable release on kernel.org, resolved when the job runs.
          - target: latest
            version: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-git # zizmor: ignore[self-repository] — actionlint rejects $/
        id: git
        with:
          version: ${{ matrix.version }}
      - name: Check that git on PATH is the one this job built
        env:
          GIT_BUILT: ${{ steps.git.outputs.path }}
        run: |
          set -euo pipefail
          if [ "$(command -v git)" != "$GIT_BUILT" ]; then
            echo "git on PATH is $(command -v git), want the one this job built, $GIT_BUILT" >&2
            exit 1
          fi
          git --version
      - name: Run tests
        env:
          ILS_TEST_GIT: ${{ matrix.target }}
        run: go test -race ./...
