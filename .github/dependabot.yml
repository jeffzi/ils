version: 2
updates:
  - package-ecosystem: github-actions
    # / covers .github/workflows only; each composite action that pins an action is listed.
    directories: [/, /.github/actions/setup-git]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      all-deps:
        patterns: ["*"]
