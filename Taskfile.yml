version: "3"

vars:
  BIN: bin/ils{{exeExt}}
  CLEAN_PATHS:
    - bin
    - dist
    - coverage.out
    - coverage.html

tasks:
  default:
    cmds:
      - task --list --sort none
    silent: true

  _require-prek:
    internal: true
    preconditions:
      - sh: command -v prek
        msg: "prek is required — install: https://github.com/j178/prek"

  _require-dprint:
    internal: true
    preconditions:
      - sh: command -v dprint
        msg: "dprint is required — install: https://dprint.dev/install/"

  _hooks:
    internal: true
    deps: [_require-prek]
    status:
      - test -f "$(git rev-parse --git-path hooks/pre-commit)"
      - test -f "$(git rev-parse --git-path hooks/commit-msg)"
      - test -f "$(git rev-parse --git-path hooks/pre-push)"
    cmds:
      - prek install

  build:
    desc: Build the binary into bin/
    cmds:
      - go build -o {{.BIN}} .

  install:
    desc: Build the binary and copy it to the directory `go install` writes to
    deps: [build]
    vars:
      INSTALL_TARGET:
        sh: go list -f '{{`{{.Target}}`}}' .
    cmds:
      - cmd: |
          target='{{.INSTALL_TARGET}}'
          dir=$(dirname "$target")
          mkdir -p "$dir"
          cp {{.BIN}} "$target.new"
          mv -f "$target.new" "$target"
          echo "Installed $target"
          if ! printf '%s' ":$PATH:" | sed 's|//*:|:|g' | grep -qF ":$dir:"; then
            echo "warning: $dir is not on PATH" >&2
          fi
        platforms: [darwin, linux]
      - cmd: >-
          powershell -NoProfile -Command
          "\$target = '{{.INSTALL_TARGET}}';
          \$dir = Split-Path -Parent \$target;
          New-Item -ItemType Directory -Force -Path \$dir | Out-Null;
          Copy-Item -Force -Path '{{.BIN}}' -Destination (\$target + '.new');
          Move-Item -Force -Path (\$target + '.new') -Destination \$target;
          Write-Output ('Installed ' + \$target);
          \$entries = \$env:PATH -split ';' | ForEach-Object { \$_.TrimEnd('\\', '/') };
          if (-not (\$entries -eq \$dir))
          { [Console]::Error.WriteLine('warning: ' + \$dir + ' is not on PATH') }"
        platforms: [windows]
    silent: true

  test:
    desc: "Run the test suite with coverage (extra args after -- skip coverage)"
    vars:
      # The macOS, Linux, and Windows platforms the race detector supports, as Go's
      # internal/platform.RaceDetectorSupported lists them.
      RACE_PLATFORMS:
        - darwin/amd64
        - darwin/arm64
        - linux/amd64
        - linux/arm64
        - linux/loong64
        - linux/ppc64le
        - linux/riscv64
        - linux/s390x
        - windows/amd64
    cmds:
      - go test {{if has (printf "%s/%s" OS ARCH) .RACE_PLATFORMS}}-race {{end}}{{if not .CLI_ARGS}}-coverprofile=coverage.out {{end}}./... {{.CLI_ARGS}}
      - "{{if not .CLI_ARGS}}go tool cover -html=coverage.out -o coverage.html{{end}}"
      - "{{if not .CLI_ARGS}}go tool go-test-coverage --config=.coverage.yml{{end}}"

  test:setup-live:
    desc: Create the live suite's test repositories on GitHub and record their URLs (safe to run again)
    cmds:
      - cmd: |
          set -eu
          user=$(gh api user --jq .login)
          for name in ils-live-minimum ils-live-latest ils-live-local; do
            if ! gh repo view "$user/$name" --json name >/dev/null 2>&1; then
              gh repo create "$user/$name" --public --add-readme
            fi
          done
          minimum=$(gh repo view "$user/ils-live-minimum" --json url --jq .url)
          latest=$(gh repo view "$user/ils-live-latest" --json url --jq .url)
          local=$(gh repo view "$user/ils-live-local" --json url --jq .url)
          gh variable set LIVE_ORIGIN_MINIMUM --body "$minimum"
          gh variable set LIVE_ORIGIN_LATEST --body "$latest"
          echo "LIVE_ORIGIN_MINIMUM $minimum"
          echo "LIVE_ORIGIN_LATEST  $latest"
          echo "task test:live      $local"
    silent: true

  test:live:
    desc: "Run the live suite against a test repository on GitHub (ILS_LIVE_ORIGIN, or your ils-live-local)"
    cmds:
      - cmd: |
          set -eu
          origin="${ILS_LIVE_ORIGIN:-}"
          if [ -z "$origin" ]; then
            origin=$(gh repo view ils-live-local --json url --jq .url) || origin=""
          fi
          if [ -z "$origin" ]; then
            echo "ILS_LIVE_ORIGIN is unset and the clone URL of your ils-live-local could not be read; run task test:setup-live first" >&2
            exit 1
          fi
          ILS_LIVE_ORIGIN="$origin" go test -tags live -count=1 -timeout 60m -v -run '^TestLive$' ./internal/cli {{.CLI_ARGS}}
    silent: true

  check:
    desc: Run every pre-commit hook across the repo
    deps: [_require-prek, _require-dprint, _hooks]
    vars:
      GIT_FILES:
        sh: git ls-files --cached --others --exclude-standard
      PREK_FILES: "{{range $f := .GIT_FILES | splitLines}}{{$f | shellQuote}} {{end}}"
    cmds:
      - prek run --files {{.PREK_FILES}}

  check:fix:
    desc: Auto-fix everything that supports it (go mod tidy, golangci-lint, dprint, markdownlint)
    deps: [_require-prek, _require-dprint]
    cmds:
      - go mod tidy
      - go tool golangci-lint run --fix
      - go tool golangci-lint fmt
      - dprint fmt
      - prek run -a markdownlint-cli2

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.CLEAN_PATHS | join " "}}
