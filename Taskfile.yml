version: "3"

vars:
  BIN: bin/ils{{exeExt}}
  CLEAN_PATHS:
    - bin
    - dist
    - coverage.out
    - coverage.html

tasks:
  default:
    cmds:
      - task --list --sort none
    silent: true

  _require-prek:
    internal: true
    preconditions:
      - sh: command -v prek
        msg: "prek is required — install: https://github.com/j178/pre-commit-rs"

  _require-dprint:
    internal: true
    preconditions:
      - sh: command -v dprint
        msg: "dprint is required — install: https://dprint.dev/install/"

  build:
    desc: Build the binary into bin/
    cmds:
      - go build -o {{.BIN}} .

  # The binary is copied, never linked: a linked development build would swap
  # the binary under every concurrent session on the next `task build`. The
  # copy lands beside the target and is renamed over it, so a session already
  # running the old binary keeps it.
  install:
    desc: Build the binary and copy it to the directory `go install` writes to
    deps: [build]
    vars:
      # `go list` resolves the path `go install` would write, with the
      # platform's executable suffix.
      INSTALL_TARGET:
        sh: go list -f '{{`{{.Target}}`}}' .
    cmds:
      - cmd: |
          target='{{.INSTALL_TARGET}}'
          dir=$(dirname "$target")
          mkdir -p "$dir"
          cp {{.BIN}} "$target.new"
          mv -f "$target.new" "$target"
          echo "Installed $target"
          if ! printf '%s' ":$PATH:" | sed 's|//*:|:|g' | grep -qF ":$dir:"; then
            echo "warning: $dir is not on PATH" >&2
          fi
        platforms: [darwin, linux]
      - cmd: >-
          powershell -NoProfile -Command
          "\$target = '{{.INSTALL_TARGET}}';
          \$dir = Split-Path -Parent \$target;
          New-Item -ItemType Directory -Force -Path \$dir | Out-Null;
          Copy-Item -Force -Path '{{.BIN}}' -Destination (\$target + '.new');
          Move-Item -Force -Path (\$target + '.new') -Destination \$target;
          Write-Output ('Installed ' + \$target);
          \$entries = \$env:PATH -split ';' | ForEach-Object { \$_.TrimEnd('\\', '/') };
          if (-not (\$entries -eq \$dir))
          { [Console]::Error.WriteLine('warning: ' + \$dir + ' is not on PATH') }"
        platforms: [windows]
    silent: true

  hooks:
    desc: Install pre-commit hooks
    deps: [_require-prek]
    cmds:
      - prek install

  test:
    desc: "Run the test suite (pass extra args after --)"
    cmds:
      - go test -race ./... {{.CLI_ARGS}}

  cov:
    desc: Run tests with coverage
    cmds:
      - go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  check:
    desc: Run every pre-commit hook across the repo
    deps: [_require-prek, _require-dprint]
    vars:
      GIT_FILES:
        sh: git ls-files --cached --others --exclude-standard
      PREK_FILES: "{{range $f := .GIT_FILES | splitLines}}{{$f | shellQuote}} {{end}}"
    cmds:
      - prek run --files {{.PREK_FILES}}

  tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy

  clean:
    desc: Remove build artifacts
    cmds:
      - cmd: rm -rf {{.CLEAN_PATHS | join " "}}
        platforms: [darwin, linux]
      - cmd: >-
          powershell -NoProfile -Command
          "Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          -Path {{.CLEAN_PATHS | join ","}}"
        platforms: [windows]
