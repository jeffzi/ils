version: "2"

formatters:
  enable:
    - gofumpt
    - goimports

linters:
  enable:
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - modernize
    - revive
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close
        - (*database/sql.Rows).Close
    govet:
      enable-all: true
    misspell:
      locale: US
